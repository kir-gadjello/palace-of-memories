name: Rust bootstrap transport

on:
  pull_request:
    branches: [main]
    paths:
      - .github/rust-bootstrap-trigger

permissions:
  contents: read

jobs:
  package-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install official Rust 1.97.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustc_path="$(rustup which --toolchain 1.97.1 rustc)"
          root="$(dirname "$(dirname "$rustc_path")")"
          echo "RUST_ROOT=$root" >> "$GITHUB_ENV"
          "$root/bin/rustc" --version --verbose
          "$root/bin/cargo" --version --verbose

      - name: Package toolchain
        shell: bash
        run: |
          set -euo pipefail
          out="rust-toolchain-1.97.1-x86_64-unknown-linux-gnu.tar.xz"
          tar -C "$RUST_ROOT" -cJf "$out" .
          sha256sum "$out" | tee "$out.sha256"
          du -h "$out"

      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: rust-toolchain-1.97.1-linux-x86_64
          path: |
            rust-toolchain-1.97.1-x86_64-unknown-linux-gnu.tar.xz
            rust-toolchain-1.97.1-x86_64-unknown-linux-gnu.tar.xz.sha256
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
